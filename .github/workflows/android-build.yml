name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Validate production API URL
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "Set the repository variable NEXT_PUBLIC_API_BASE_URL to the HTTPS API URL."
            exit 1
          fi
      - name: Install web and Capacitor dependencies
        run: npm install
      - name: Export mobile web app
        run: npm run build
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ai-comic-mobile-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
