name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/android-build.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.example.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Validate production API URL for manual release builds
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_BASE_URL }}" ]; then
            echo "Set the repository variable NEXT_PUBLIC_API_BASE_URL to the HTTPS API URL."
            exit 1
          fi
      - name: Install web and Capacitor dependencies
        run: npm install
      - name: Export mobile web app
        run: npm run build
      - name: Add Android project
        run: npx cap add android
      - name: Configure native Android share receiver
        run: python scripts/configure-android-share.py
      - name: Declare verified AI client packages for Android 11+
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          queries = """    <queries>
                  <package android:name="com.openai.chatgpt" />
                  <package android:name="com.deepseek.chat" />
                  <package android:name="com.anthropic.claude" />
                  <package android:name="com.larus.nova" />
                  <package android:name="com.bytedance.dreamina" />
                  <package android:name="com.lemon.lvoverseas" />
              </queries>
          """
          if "<queries>" not in content:
              content = content.replace("<manifest", "<manifest", 1)
              marker = "    <application"
              if marker not in content:
                  raise SystemExit("Android manifest application element not found")
              content = content.replace(marker, queries + marker, 1)
              manifest.write_text(content, encoding="utf-8")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ai-comic-mobile-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
