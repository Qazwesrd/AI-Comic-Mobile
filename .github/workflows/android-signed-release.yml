name: Android Signed Release APK

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "选择用于构建测试 APK 的源码分支"
        required: true
        type: choice
        default: fix/email-code-registration
        options:
          - fix/email-code-registration
          - main
      version_name:
        description: "版本号，例如 0.1.0"
        required: true
        type: string
      version_code:
        description: "递增的 Android versionCode"
        required: true
        type: number
      api_base_url:
        description: "可选：HTTPS API 根地址"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    environment: test-release
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || vars.NEXT_PUBLIC_API_BASE_URL }}
      RELEASE_CHANNEL: test
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Validate release inputs and signing secrets
        run: |
          python - <<'PY'
          import os, re, sys
          required = ["ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing GitHub Actions signing secrets: " + ", ".join(missing))
          if not re.fullmatch(r"[0-9]+", os.environ["VERSION_CODE"]) or int(os.environ["VERSION_CODE"]) < 1:
              raise SystemExit("version_code must be a positive integer")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?", os.environ["VERSION_NAME"]):
              raise SystemExit("version_name must use semantic version format, e.g. 0.1.0")
          api = os.environ.get("NEXT_PUBLIC_API_BASE_URL", "").strip()
          if not api.startswith("https://") or api.endswith("/") or any(x in api.lower() for x in ("localhost", "127.0.0.1", ".invalid")):
              raise SystemExit("NEXT_PUBLIC_API_BASE_URL must be a real HTTPS API root URL without a trailing slash")
          PY
      - name: Install web and Capacitor dependencies
        run: npm ci
      - name: Export mobile web app
        run: npm run build
      - name: Add Android project
        run: npx cap add android
      - name: Configure native Android integrations
        run: |
          python scripts/configure-android-share.py
          python scripts/configure-android-ai-launcher.py
      - name: Declare verified AI client packages for Android 11+
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          queries = """    <queries>
                  <package android:name="com.openai.chatgpt" />
                  <package android:name="com.deepseek.chat" />
                  <package android:name="com.anthropic.claude" />
                  <package android:name="com.larus.nova" />
                  <package android:name="com.bytedance.dreamina" />
                  <package android:name="com.lemon.lvoverseas" />
              </queries>
          """
          if "<queries>" not in content:
              marker = "    <application"
              if marker not in content:
                  raise SystemExit("Android manifest application element not found")
              manifest.write_text(content.replace(marker, queries + marker, 1), encoding="utf-8")
          PY
      - name: Configure release signing and version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import base64
          keystore = Path(os.environ["RUNNER_TEMP"]) / "android-release.jks"
          keystore.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          gradle = Path("android/app/build.gradle")
          if not gradle.exists():
              raise SystemExit("Expected Capacitor Android app/build.gradle was not generated")
          content = gradle.read_text(encoding="utf-8")
          if "signingConfigs {" in content:
              raise SystemExit("Unexpected pre-existing signingConfigs block; refusing ambiguous patch")
          content = content.replace(
              "android {",
              """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/android-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """,
              1,
          )
          content = content.replace(
              "defaultConfig {",
              """defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE"))
                  versionName System.getenv("VERSION_NAME")
              """,
              1,
          )
          marker = "buildTypes {"
          if marker not in content:
              raise SystemExit("Android buildTypes block not found")
          content = content.replace(
              marker,
              """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              """,
              1,
          )
          gradle.write_text(content, encoding="utf-8")

          # Keep one applicationId/signing identity for upgrade compatibility,
          # while making the test build visibly distinguishable to users.
          if "com.qazwesrd.aicomicmobile" not in content:
              raise SystemExit("Unexpected Android applicationId; expected com.qazwesrd.aicomicmobile")
          strings = Path("android/app/src/main/res/values/strings.xml")
          if not strings.exists():
              raise SystemExit("Android app strings.xml not found")
          xml = strings.read_text(encoding="utf-8")
          if os.environ["RELEASE_CHANNEL"] == "test":
              import re
              xml, count = re.subn(
                  r'<string name="app_name">(.*?)</string>',
                  lambda match: '<string name="app_name">' + match.group(1) + '（测试版）</string>',
                  xml,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not mark the test APK app label")
          strings.write_text(xml, encoding="utf-8")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build signed release APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature and calculate SHA-256
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/release/SHA256SUMS.txt
          cp "$APK" "android/app/build/outputs/apk/release/AI-Comic-Mobile-${RELEASE_CHANNEL}-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-comic-mobile-test-${{ inputs.version_name }}
          path: |
            apps/web/android/app/build/outputs/apk/release/AI-Comic-Mobile-test-${{ inputs.version_name }}.apk
            apps/web/android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
