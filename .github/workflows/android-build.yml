name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "真实部署的 HTTPS API 根地址（例如 https://api.your-domain.com）"
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/android-build.yml"

jobs:
  android:
    if: github.event_name != 'pull_request' || vars.NEXT_PUBLIC_API_BASE_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Validate backend API URL
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("NEXT_PUBLIC_API_BASE_URL", "").strip()
          if not value:
              raise SystemExit(
                  "Missing API URL. Set the GitHub repository variable NEXT_PUBLIC_API_BASE_URL "
                  "or provide api_base_url when manually starting this workflow."
              )

          parsed = urlparse(value)
          host = (parsed.hostname or "").lower()
          if parsed.scheme != "https" or not host:
              raise SystemExit("NEXT_PUBLIC_API_BASE_URL must be an absolute HTTPS URL.")
          if host in {"localhost", "127.0.0.1", "0.0.0.0", "api.example.invalid", "example.com", "example.org", "example.net"} or host.endswith(".invalid"):
              raise SystemExit("NEXT_PUBLIC_API_BASE_URL is still a local or placeholder address.")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("NEXT_PUBLIC_API_BASE_URL must not contain credentials, query, or fragment.")
          if parsed.path not in {"", "/"}:
              raise SystemExit("Set NEXT_PUBLIC_API_BASE_URL to the API origin only, without a path.")
          print(f"Using configured API origin: https://{host}")
          PY
          echo "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL%/}" >> "$GITHUB_ENV"
      - name: Install web and Capacitor dependencies
        run: npm install
      - name: Export mobile web app
        run: npm run build
      - name: Add Android project
        run: npx cap add android
      - name: Configure native Android share receiver
        run: python scripts/configure-android-share.py
      - name: Configure native Android AI client launcher
        run: python scripts/configure-android-ai-launcher.py
      - name: Declare verified AI client packages for Android 11+
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          queries = """    <queries>
                  <package android:name="com.openai.chatgpt" />
                  <package android:name="com.deepseek.chat" />
                  <package android:name="com.anthropic.claude" />
                  <package android:name="com.larus.nova" />
                  <package android:name="com.bytedance.dreamina" />
                  <package android:name="com.lemon.lvoverseas" />
              </queries>
          """
          if "<queries>" not in content:
              marker = "    <application"
              if marker not in content:
                  raise SystemExit("Android manifest application element not found")
              content = content.replace(marker, queries + marker, 1)
              manifest.write_text(content, encoding="utf-8")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            if ./gradlew --no-daemon assembleDebug; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ai-comic-mobile-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
